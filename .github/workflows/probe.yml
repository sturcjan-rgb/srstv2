name: Diagnostika náhledů (dočasné)
on:
  push:
    branches: [claude/festive-newton-7mg0hs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Scraper (bez commitu)
        run: |
          node scraper.mjs
          node -e 'const m=require("./data/matches.json");console.log("s thumb:",m.filter(x=>x.thumb).length,"/",m.length);console.log(m.slice(0,3))'
      - name: Obrázky z tvcom (hotlink test)
        run: |
          for id in 268544 268538; do
            for ref in "" "https://tv.srsni.com/"; do
              curl -sS -o /tmp/p.img -D - -e "$ref" "https://tvcom-dynamic.ssl.cdn.cra.cz/Pictures/Video/Picture.ashx?VideoId=$id&Width=640" | grep -iE "^HTTP|content-type|content-length|location"
              echo "ref='$ref' size=$(stat -c%s /tmp/p.img) $(file -b /tmp/p.img)"
            done
          done
          curl -sS -o /tmp/s.img "https://tvcom-dynamic.ssl.cdn.cra.cz/Pictures/Video/Picture.ashx?VideoId=268544&Width=200"
          echo "B64START"; base64 -w0 /tmp/s.img; echo; echo "B64END"
